services:
  postgres:
    image: postgres:16
    container_name: orbit-lab4-postgres
    environment:
      POSTGRES_USER: orbit
      POSTGRES_PASSWORD: orbit12345
      POSTGRES_DB: orbitlab
    ports:
      - "5433:5432"
    volumes:
      - orbit_lab4_postgres:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U orbit -d orbitlab"]
      interval: 3s
      timeout: 3s
      retries: 20

  adminer:
    image: adminer:latest
    container_name: orbit-lab4-adminer
    ports:
      - "8081:8080"
    depends_on:
      postgres:
        condition: service_healthy

  minio:
    image: minio/minio:latest
    container_name: orbit-lab4-minio
    command: server /data --console-address ":9001"
    environment:
      MINIO_ROOT_USER: minioadmin
      MINIO_ROOT_PASSWORD: minioadmin123
    ports:
      - "9000:9000"
      - "9001:9001"
    volumes:
      - orbit_lab4_minio:/data

  redis:
    image: redis:7-alpine
    container_name: orbit-lab4-redis
    ports:
      - "6379:6379"
    command: redis-server --save "" --appendonly no

volumes:
  orbit_lab4_postgres:
  orbit_lab4_minio:
