<!doctype html>
<html lang="ru">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>Плитка — Orbita</title>
  <link rel="stylesheet" href="/static/css/style.css">
</head>
<body>
<main class="phone standard-page">
  <header class="page-header">
    <h1>ПЛИТКА</h1>
  </header>

  <form class="filter-form" method="get" action="/services">
    <label for="min_payload">МИНИМАЛЬНАЯ ПОЛЕЗНАЯ НАГРУЗКА, КГ</label>
    <div class="filter-row">
      <input id="min_payload" type="number" min="0" name="min_payload" placeholder="Например, 8300" value="{{ .minPayload }}">
      <button type="submit">ФИЛЬТР</button>
    </div>
  </form>

  <section class="card-grid">
    {{ range .services }}
    <a class="service-card" href="/feed?id={{ .ID }}">
      <img src="{{ .ImageURL }}" alt="{{ .Name }}">
      <div class="card-content">
        <h2>{{ .Name }}</h2>
        <div class="sub">Широта: {{ printf "%.2f" .Latitude }}°</div>
        <strong>{{ .MaxPayloadKg }} кг</strong>
        <div class="card-meta">
          <span>♡ {{ index $.likeCounts .ID }}</span>
          <span>ID {{ .ID }}</span>
        </div>
      </div>
    </a>
    {{ else }}
    <p class="empty">По этому фильтру услуг нет.</p>
    {{ end }}
  </section>

  <nav class="bottom-nav">
    <a class="nav-link" href="/feed"><span class="nav-icon">▤</span><span>Лента</span></a>
    <a class="nav-link" href="/add"><span class="nav-icon">⊞</span><span>Добавление</span></a>
    <a class="nav-link active" href="/services"><span class="nav-icon">▦</span><span>Плитка</span></a>
  </nav>
</main>
</body>
</html>
