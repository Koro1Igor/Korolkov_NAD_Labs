<!doctype html>
<html lang="ru">
<head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>Услуги запуска</title><link rel="stylesheet" href="/resources/css/style.css"></head>
<body>
<nav><a href="/">Лента</a><a href="/launch-vehicles">Услуги</a><a href="/add">Добавить</a></nav>
<main><h1>Услуги запуска</h1><form id="filter"><div class="grid"><label>Минимальная нагрузка<input name="payload_min" type="number" min="0" value="0"></label><label>Максимальная нагрузка<input name="payload_max" type="number" min="0" value="30000"></label></div><button>Применить</button></form><section id="items" class="grid"></section></main>
<script>
async function load(){const q=new URLSearchParams(new FormData(document.querySelector('#filter')));const response=await fetch('/api/launch-vehicles?'+q);const data=await response.json();document.querySelector('#items').innerHTML=response.ok?data.items.map(item=>`<article class="card">${item.image_url?`<img src="${item.image_url}" alt="${item.name}">`:''}<h2>${item.name}</h2><p>${item.short_description||''}</p><p>${item.payload_kg} кг · ${item.like_count} лайков</p>${item.is_creator?`<button class="danger" onclick="removeItem(${item.id})">Удалить</button>`:''}</article>`).join(''):`<p>${data.error}</p>`}
async function removeItem(id){await fetch('/api/launch-vehicles/'+id,{method:'DELETE'});await load()}
document.querySelector('#filter').onsubmit=event=>{event.preventDefault();load()};load();
</script>
</body></html>
