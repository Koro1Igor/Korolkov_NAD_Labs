<!doctype html>
<html lang="ru">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>Лента — Launch Vehicle</title>
  <link rel="stylesheet" href="/static/css/style.css">
</head>
<body>
<main class="phone">
  <section class="reel">
    <video class="reel-video" autoplay muted loop playsinline poster="{{ .launchVehicle.ImageURL }}">
      <source src="{{ .launchVehicle.VideoURL }}" type="video/mp4">
    </video>
    <div class="shade"></div>

    <header class="reel-top">
      <div class="wordmark">ЛЕНТА</div>
    </header>

    <aside class="reel-side">
      <div class="fact"><b>{{ .launchVehicle.PayloadKg }}</b><span>полезная нагрузка, кг</span></div>
      <div class="fact"><b>{{ .launchVehicle.SeaLevelThrustKN }}</b><span>тяга у моря, кН</span></div>
      <div class="side-action"><span class="heart">♡</span><b>{{ .likeCount }}</b></div>
      <a class="next-round" href="/feed?id={{ .launchVehicle.ID }}&next=true" aria-label="Следующий">→</a>
    </aside>

    <div class="reel-copy">
      <h1>{{ .launchVehicle.Name }}</h1>
      <details class="description-details">
        <summary><span class="more-label">Больше</span><span class="less-label">Меньше</span></summary>
        <p>{{ .launchVehicle.Description }}</p>
      </details>
    </div>
  </section>

  <nav class="bottom-nav">
    <a class="nav-link active" href="/feed"><span class="nav-icon">▤</span><span>Лента</span></a>
    <a class="nav-link" href="/add"><span class="nav-icon">⊞</span><span>Добавление</span></a>
    <a class="nav-link" href="/launch-vehicles"><span class="nav-icon">▦</span><span>Плитка</span></a>
  </nav>
</main>
</body>
</html>
