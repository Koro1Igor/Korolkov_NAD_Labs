<!doctype html>
<html lang="ru">
<head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>Лента запусков</title><link rel="stylesheet" href="/resources/css/style.css"></head>
<body>
<nav><a href="/">Лента</a><a href="/launch-vehicles">Услуги</a><a href="/add">Добавить</a></nav>
<main><h1>Лента</h1><p class="muted">Опубликованные услуги вывода спутников на орбиту.</p><section id="feed" class="card">Загрузка…</section><div class="actions"><button id="like">Поставить лайк</button><button id="next">Следующая</button></div></main>
<script>
let current;
async function load(next=false){const q=current&&next?'?id='+current.id+'&next=true':'';const response=await fetch('/api/feed'+q);const data=await response.json();if(!response.ok){document.querySelector('#feed').textContent=data.error;return}current=data;document.querySelector('#feed').innerHTML=`${data.image_url?`<img src="${data.image_url}" alt="${data.name}">`:''}<h2>${data.name}</h2><p>${data.short_description||''}</p><p>Полезная нагрузка: ${data.payload_kg??'—'} кг · Лайки: ${data.like_count}</p>`;document.querySelector('#like').textContent=data.liked?'Убрать лайк':'Поставить лайк'}
document.querySelector('#next').onclick=()=>load(true);
document.querySelector('#like').onclick=async()=>{if(!current)return;await fetch(`/api/launch-vehicles/${current.id}/like`,{method:'POST',headers:{'Content-Type':'application/json'},body:JSON.stringify({value:current.liked?0:1})});await load()};
load();
</script>
</body></html>
