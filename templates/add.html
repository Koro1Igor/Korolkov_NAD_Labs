<!doctype html>
<html lang="ru">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>Добавление — Launch Vehicle</title>
  <link rel="stylesheet" href="/static/css/style.css">
</head>
<body>
<main class="phone standard-page">
  <header class="page-header">
    <h1>ДОБАВЛЕНИЕ</h1>
    <span class="badge">ЧЕРНОВИК</span>
  </header>

  <form class="edit-form">
    <label>ИЗОБРАЖЕНИЕ
      <input type="file" accept="image/*">
    </label>

    <label>ВИДЕО
      <input type="file" accept="video/*">
    </label>

    <label>НАЗВАНИЕ LAUNCH VEHICLE
      <input type="text" value="{{ .launchVehicle.Name }}">
    </label>

    <label>ПОЛЕЗНАЯ НАГРУЗКА, КГ
      <input type="number" min="0" value="{{ .launchVehicle.PayloadKg }}">
    </label>

    <label>ТЯГА НА УРОВНЕ МОРЯ, КН
      <input type="number" min="0" value="{{ .launchVehicle.SeaLevelThrustKN }}">
    </label>

    <label>ОПИСАНИЕ
      <textarea rows="5">{{ .launchVehicle.Description }}</textarea>
    </label>

    <button class="next-button" type="button">ДАЛЕЕ</button>
  </form>

  <nav class="bottom-nav">
    <a class="nav-link" href="/feed"><span class="nav-icon">▤</span><span>Лента</span></a>
    <a class="nav-link active" href="/add"><span class="nav-icon">⊞</span><span>Добавление</span></a>
    <a class="nav-link" href="/launch-vehicles"><span class="nav-icon">▦</span><span>Плитка</span></a>
  </nav>
</main>
</body>
</html>
