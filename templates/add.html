<!doctype html>
<html lang="ru">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>Добавление — Launch Vehicle</title>
  <link rel="stylesheet" href="/static/css/style.css">
</head>
<body>
<main class="phone standard-page">
  <header class="page-header">
    <h1>ДОБАВЛЕНИЕ</h1>
    {{ if .hasDraft }}<span class="badge">ЧЕРНОВИК</span>{{ end }}
  </header>

  {{ if .hasDraft }}
  <form class="edit-form" method="post" action="/launch-vehicles/publish">
    <input type="hidden" name="id" value="{{ .launchVehicle.ID }}">

    <div class="draft-preview"><img src="{{ .launchVehicle.ImageURL }}" alt="{{ .launchVehicle.Name }}"></div>

    <label>НАЗВАНИЕ LAUNCH VEHICLE
      <input type="text" value="{{ .launchVehicle.Name }}" disabled>
    </label>

    <label>КРАТКАЯ ИНФОРМАЦИЯ
      <textarea name="short_description" rows="5" required>{{ .launchVehicle.ShortDescription }}</textarea>
    </label>

    <label>ПОЛЕЗНАЯ НАГРУЗКА, КГ
      <input name="payload_kg" type="number" min="0" value="{{ .launchVehicle.PayloadKg }}" required>
    </label>

    <label>ТЯГА НА УРОВНЕ МОРЯ, КН
      <input name="sea_level_thrust_kn" type="number" min="0" value="{{ .launchVehicle.SeaLevelThrustKN }}" required>
    </label>

    <button class="primary-button" type="submit">ОПУБЛИКОВАТЬ</button>
  </form>
  {{ else }}
  <form class="edit-form" method="post" action="/launch-vehicles/create">
    <label>ИЗОБРАЖЕНИЕ
      <input type="file" accept="image/*" required>
      <span class="hint">В ЛР2 файл выбирается в интерфейсе, но на сервер не отправляется.</span>
    </label>

    <label>ВИДЕО
      <input type="file" accept="video/*" required>
      <span class="hint">Для новой карточки используется медиа по умолчанию.</span>
    </label>

    <label>НАЗВАНИЕ LAUNCH VEHICLE
      <input name="name" type="text" required>
    </label>

    <button class="primary-button" type="submit">ДАЛЕЕ</button>
  </form>
  {{ end }}

  <nav class="bottom-nav">
    <a class="nav-link" href="/feed"><span class="nav-icon">▤</span><span>Лента</span></a>
    <a class="nav-link active" href="/add"><span class="nav-icon">⊞</span><span>Добавление</span></a>
    <a class="nav-link" href="/launch-vehicles"><span class="nav-icon">▦</span><span>Плитка</span></a>
  </nav>
</main>
</body>
</html>
