<!doctype html>
<html lang="ru">
<head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>Добавить услугу</title><link rel="stylesheet" href="/resources/css/style.css"></head>
<body>
<nav><a href="/">Лента</a><a href="/launch-vehicles">Услуги</a><a href="/add">Добавить</a></nav>
<main><h1>Новая услуга</h1><form id="create"><label>Название<input name="name" maxlength="120" required></label><label>Изображение<input name="image" type="file" accept="image/*" required></label><label>Видео<input name="video" type="file" accept="video/*" required></label><button>Создать черновик</button></form><form id="publish"><label>Краткое описание<textarea name="short_description" maxlength="500" required></textarea></label><label>Полезная нагрузка, кг<input name="payload_kg" type="number" min="0" required></label><label>Тяга у земли, кН<input name="sea_level_thrust_kn" type="number" min="0" required></label><button>Опубликовать черновик</button></form><pre id="result" class="result"></pre></main>
<script>
const result=document.querySelector('#result');
document.querySelector('#create').onsubmit=async event=>{event.preventDefault();const response=await fetch('/api/launch-vehicles',{method:'POST',body:new FormData(event.target)});result.textContent=JSON.stringify(await response.json(),null,2)};
document.querySelector('#publish').onsubmit=async event=>{event.preventDefault();const data=Object.fromEntries(new FormData(event.target));data.payload_kg=Number(data.payload_kg);data.sea_level_thrust_kn=Number(data.sea_level_thrust_kn);const response=await fetch('/api/launch-vehicles/draft',{method:'PUT',headers:{'Content-Type':'application/json'},body:JSON.stringify(data)});result.textContent=JSON.stringify(await response.json(),null,2)};
</script>
</body></html>
